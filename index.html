<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Now Playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Album-driven colours. Registered so they can animate smoothly between tracks. */
@property --accent { syntax: '<color>'; inherits: true; initial-value: #8fb2ff; }
@property --glow1  { syntax: '<color>'; inherits: true; initial-value: #1f5f8b; }
@property --glow2  { syntax: '<color>'; inherits: true; initial-value: #8b2a4a; }
@property --glow3  { syntax: '<color>'; inherits: true; initial-value: #4a3a9b; }
@property --bar1   { syntax: '<color>'; inherits: true; initial-value: #c9a7ff; }
@property --artistc { syntax: '<color>'; inherits: true; initial-value: #c9d6f2; }

:root {
  --accent: #8fb2ff; --glow1: #1f5f8b; --glow2: #8b2a4a; --glow3: #4a3a9b; --bar1: #c9a7ff; --artistc: #c9d6f2;
  transition: --accent 1.2s ease, --bar1 1.2s ease, --artistc 1.2s ease, --glow1 1.8s ease, --glow2 1.8s ease, --glow3 1.8s ease;
  --card-w: 700px;
  --text: #f2f5fb;
  --muted: rgba(226, 232, 244, 0.62);
}
html, body { margin: 0; background: transparent; overflow: hidden; }
body { font-family: Inter, system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }

.stage { padding: 28px; transform-origin: top left; }

/* ---------- Card ---------- */
.card {
  position: relative; width: var(--card-w); box-sizing: border-box;
  display: flex; align-items: center; gap: 30px; padding: 24px 30px 24px 24px;
  border-radius: 28px; overflow: hidden; isolation: isolate;
  background: linear-gradient(135deg, rgba(20, 19, 42, 0.9), rgba(16, 15, 34, 0.88));
  box-shadow:
    0 18px 50px -12px rgba(0, 0, 0, 0.65),
    inset 0 0 0 1px rgba(255, 255, 255, 0.09),
    inset 0 1px 0 rgba(255, 255, 255, 0.14);
  transition: opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1);
}
.stage.hidden .card { opacity: 0; transform: translateY(18px) scale(.97); }

/* Soft coloured glows inside the glass */
.glows { position: absolute; inset: 0; z-index: -2; }
.glows i { position: absolute; border-radius: 50%; filter: blur(50px); opacity: .32; }
.glows .g1 { width: 240px; height: 240px; left: -60px; top: -110px; background: var(--glow1); animation: drift1 14s ease-in-out infinite alternate; }
.glows .g2 { width: 220px; height: 220px; left: 180px; bottom: -150px; background: var(--glow2); animation: drift2 17s ease-in-out infinite alternate; }
.glows .g3 { width: 260px; height: 260px; right: -90px; top: -60px; background: var(--glow3); opacity: .26; animation: drift3 19s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate(70px, 40px) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-60px, -30px) scale(.9); } }
@keyframes drift3 { to { transform: translate(-80px, 50px) scale(1.1); } }
/* frosted sheen on top of the glows */
.card::before {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
  background:
    linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,0) 45%),
    radial-gradient(120% 140% at 0% 0%, rgba(255,255,255,.05), transparent 60%);
}

/* ---------- Album art ---------- */
.art {
  position: relative; flex: none; width: 128px; height: 128px; border-radius: 20px; overflow: hidden;
  background: rgba(255,255,255,.06);
  box-shadow: 0 10px 28px -8px rgba(0,0,0,.7), 0 0 0 1.5px rgba(255,255,255,.16);
}
.art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.06); transition: opacity .7s ease, transform .9s cubic-bezier(.2,.8,.2,1); }
.art img.show { opacity: 1; transform: none; }

/* ---------- Text + progress ---------- */
.info { flex: 1; min-width: 0; transition: opacity .28s ease, transform .28s ease; }
.info.out { opacity: 0; transform: translateX(10px); }

.title-wrap { overflow: hidden; white-space: nowrap; --fade: linear-gradient(90deg, transparent, #000 4%, #000 92%, transparent); mask-image: var(--fade); -webkit-mask-image: var(--fade); }
.title-wrap.fits { mask-image: none; -webkit-mask-image: none; }
.title { display: inline-block; font-family: "Inter Tight", Inter, sans-serif; font-weight: 700; font-size: 36px; line-height: 1.15; letter-spacing: -0.01em; padding-right: 4px; text-shadow: 0 2px 10px rgba(0,0,0,.55); }
.title.scroll { animation: marquee var(--marquee-dur, 10s) ease-in-out infinite alternate; }
@keyframes marquee { 0%, 18% { transform: translateX(0); } 82%, 100% { transform: translateX(calc(-1 * var(--marquee-dist, 0px))); } }

.row { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
.artist { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--artistc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.time { flex: none; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 700; letter-spacing: .06em; color: rgba(214, 218, 230, .72); font-variant-numeric: tabular-nums; }
.divider { width: 1.5px; height: 13px; border-radius: 1px; background: rgba(255,255,255,.25); }
.card.paused .time { opacity: .6; }

.bar { position: relative; height: 4px; margin-top: 20px; border-radius: 4px; background: rgba(255,255,255,.13); }
.fill {
  position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: inherit;
  background: linear-gradient(90deg, var(--bar1), var(--accent));
  box-shadow: 0 0 12px -2px var(--accent);
}
.knob {
  position: absolute; right: -5px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%;
  background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.12), 0 0 12px 2px var(--accent);
}

/* ---------- Transparent mode (default): no card, just art + text over your scene ---------- */
body.clear .card { background: none; box-shadow: none; }
body.clear .card::before, body.clear .glows { display: none; }
body.clear .title { text-shadow: 0 2px 4px rgba(0,0,0,.6), 0 2px 18px rgba(0,0,0,.55); }
body.clear .artist, body.clear .time { text-shadow: 0 1px 3px rgba(0,0,0,.85), 0 0 12px rgba(0,0,0,.6); }
body.clear .time { color: rgba(236, 239, 247, .88); }
body.clear .divider { background: rgba(255,255,255,.5); box-shadow: 0 0 3px rgba(0,0,0,.7); }
body.clear .bar { background: rgba(255,255,255,.28); box-shadow: 0 1px 4px rgba(0,0,0,.55); }
body.clear .art { box-shadow: 0 8px 24px -6px rgba(0,0,0,.75), 0 0 0 1.5px rgba(255,255,255,.2); }

/* ---------- Connect / setup UI ---------- */
.connect { width: var(--card-w); box-sizing: border-box; padding: 22px 24px; border-radius: 24px; background: rgba(11,15,24,.9); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
.connect h2 { margin: 0 0 6px; font: 700 18px "Inter Tight", Inter, sans-serif; }
.connect p { margin: 0 0 14px; font-size: 13px; line-height: 1.5; color: var(--muted); }
.connect code { font-size: 12px; color: #cfe0ff; }
.btn { appearance: none; border: 0; cursor: pointer; padding: 11px 18px; border-radius: 999px; font: 600 14px Inter, sans-serif; color: #07130b; background: #1ed760; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: rgba(255,255,255,.1); color: var(--text); }
textarea.link { width: 100%; box-sizing: border-box; height: 92px; margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.14); background: rgba(0,0,0,.35); color: #dbe6ff; font: 12px ui-monospace, Consolas, monospace; resize: none; }
.warn { color: #ffcf7a !important; }

body.setup { background: #0b0f18; min-height: 100vh; display: grid; place-items: center; overflow: auto; }
body.setup .stage { padding: 16px; }
body.setup #stage { display: none; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="stage hidden" id="stage">
  <div class="card" id="card">
    <div class="glows"><i class="g1"></i><i class="g2"></i><i class="g3"></i></div>
    <div class="art"><img id="artA" alt=""><img id="artB" alt=""></div>
    <div class="info" id="info">
      <div class="title-wrap" id="titleWrap"><span class="title" id="title"></span></div>
      <div class="row">
        <div class="artist" id="artist"></div>
        <div class="time"><span class="divider"></span><span><span id="cur">0:00</span> / <span id="dur">0:00</span></span></div>
      </div>
      <div class="bar"><div class="fill" id="fill"><div class="knob"></div></div></div>
    </div>
  </div>
</div>

<div class="stage" id="panel" hidden>
  <div class="connect" id="panelBody"></div>
</div>

<script>
/* =====================================================================
   Spotify Now Playing widget — single file, no server needed.
   URL options:
     ?cid=YOUR_CLIENT_ID   Spotify app Client ID (or paste it below)
     ?setup=1              open in a normal browser to get your OBS link
     ?demo=1               fake songs, for previewing the look
     ?scale=1.25           make the whole widget bigger/smaller
     ?paused=show          keep showing when paused (default: hide after 5s)
     ?bg=card              show the dark glass card behind it (default: transparent)
   ===================================================================== */
const CLIENT_ID_DEFAULT = '';            // optional: paste your Client ID here instead of using ?cid=

const Q = new URLSearchParams(location.search);
const HASH = new URLSearchParams(location.hash.slice(1));
const REDIRECT_URI = location.origin + location.pathname;
const SCOPES = 'user-read-currently-playing user-read-playback-state';
const POLL_MS = 1500;
const END_CHECK_MS = 400;                // check this long after a song should end
const PAUSE_HIDE_MS = 5000;
const SHOW_WHEN_PAUSED = Q.get('paused') === 'show';

const store = {
  get: k => { try { return localStorage.getItem('npw_' + k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem('npw_' + k, v); } catch {} },
  del: k => { try { localStorage.removeItem('npw_' + k); } catch {} },
};
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const stage = $('stage'), card = $('card'), info = $('info');

if (Q.get('bg') !== 'card') document.body.classList.add('clear');   // transparent by default; ?bg=card for the glass card
const scale = parseFloat(Q.get('scale'));
if (scale > 0) { stage.style.transform = `scale(${scale})`; $('panel').style.transform = `scale(${scale})`; }

/* ---------------- Rendering ---------------- */
const state = { id: null, progress: 0, dur: 1, fetchedAt: 0, playing: false, lastPlayingAt: 0, swapSeq: 0, lastSec: -1 };

function fmt(ms) {
  const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
}

function setVisible(v) { stage.classList.toggle('hidden', !v); }

function render(t) {
  if (!t) { setVisible(false); state.id = null; return; }
  state.progress = t.progress; state.dur = t.dur || 1; state.fetchedAt = performance.now(); state.playing = t.playing;
  if (t.playing) state.lastPlayingAt = Date.now();
  card.classList.toggle('paused', !t.playing);
  const hideForPause = !t.playing && !SHOW_WHEN_PAUSED && Date.now() - state.lastPlayingAt > PAUSE_HIDE_MS;
  if (t.id !== state.id) { state.id = t.id; swapTrack(t); }
  else setVisible(!hideForPause);
}

async function swapTrack(t) {
  const seq = ++state.swapSeq;
  const first = !card.classList.contains('ready');
  const img = t.art ? await loadImage(t.art) : null;
  if (seq !== state.swapSeq) return;                       // a newer track arrived meanwhile
  if (!first && !stage.classList.contains('hidden')) { info.classList.add('out'); await sleep(280); }
  if (seq !== state.swapSeq) return;

  $('title').textContent = t.title;
  $('artist').textContent = t.artist;
  $('dur').textContent = fmt(t.dur);
  state.lastSec = -1;

  const a = $('artA'), b = $('artB');
  const next = a.classList.contains('show') ? b : a, prev = next === a ? b : a;
  if (img) { next.src = img.src; next.classList.add('show'); prev.classList.remove('show'); }
  else { a.classList.remove('show'); b.classList.remove('show'); }

  applyPalette(img && img.__cors ? extractPalette(img) : null);
  info.classList.remove('out');
  card.classList.add('ready');
  setVisible(t.playing || SHOW_WHEN_PAUSED || Date.now() - state.lastPlayingAt <= PAUSE_HIDE_MS);
  fitTitle();
}

function fitTitle() {
  const wrap = $('titleWrap'), el = $('title');
  el.classList.remove('scroll');
  const dist = el.scrollWidth - wrap.clientWidth;
  wrap.classList.toggle('fits', dist <= 0);
  if (dist > 0) {
    el.style.setProperty('--marquee-dist', dist + 'px');
    el.style.setProperty('--marquee-dur', Math.max(6, dist / 22 + 4) + 's');
    void el.offsetWidth; el.classList.add('scroll');
  }
}

function tick() {
  if (state.id) {
    const pos = Math.min(state.dur, state.progress + (state.playing ? performance.now() - state.fetchedAt : 0));
    $('fill').style.width = (pos / state.dur * 100).toFixed(3) + '%';
    const sec = Math.floor(pos / 1000);
    if (sec !== state.lastSec) { state.lastSec = sec; $('cur').textContent = fmt(pos); }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------------- Album colours ---------------- */
function loadImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { img.__cors = true; resolve(img); };
    img.onerror = () => {                       // CORS refused: still show the art, just no colour pick
      const plain = new Image();
      plain.onload = () => resolve(plain);
      plain.onerror = () => resolve(null);
      plain.src = src;
    };
    img.src = src;
  });
}

function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
  if (max === min) return [0, 0, l];
  const d = max - min, s = l > .5 ? d / (2 - max - min) : d / (max + min);
  let h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h / 6, s, l];
}
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const hsl = (h, s, l) => `hsl(${Math.round(h * 360)}, ${Math.round(s * 100)}%, ${Math.round(l * 100)}%)`;

function extractPalette(img) {
  try {
    const N = 40, c = document.createElement('canvas'); c.width = c.height = N;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(img, 0, 0, N, N);
    const d = x.getImageData(0, 0, N, N).data;
    const K = 18, buckets = Array.from({ length: K }, (_, k) => ({ k, w: 0, h: 0, s: 0, l: 0 }));
    for (let i = 0; i < d.length; i += 4) {
      const [h, s, l] = rgb2hsl(d[i], d[i + 1], d[i + 2]);
      if (l < .07 || l > .96 || s < .16) continue;
      const w = s * s * (1 - Math.abs(l - .5) * 1.3);
      const bk = buckets[Math.floor(h * K) % K];
      bk.w += w; bk.h += h * w; bk.s += s * w; bk.l += l * w;
    }
    const ranked = buckets.filter(b => b.w > 0).sort((a, b) => b.w - a.w);
    if (!ranked.length || ranked[0].w < 6) return null;     // basically black & white cover
    const avg = b => [b.h / b.w, b.s / b.w, b.l / b.w];
    const hueGap = (a, b) => Math.min(Math.abs(a.k - b.k), K - Math.abs(a.k - b.k));
    const main = ranked[0];
    const others = ranked.filter(b => hueGap(b, main) >= 2 && b.w > main.w * .08);
    const [h, s, l] = avg(main);
    const second = others[0] ? avg(others[0]) : [(h + .06) % 1, s, l];
    const h2 = second[0];
    const h3 = others[1] ? avg(others[1])[0] : (h + .92) % 1;
    // Bar fades from the cover's second colour into its main colour (e.g. orange -> blue)
    return {
      accent: hsl(h, clamp(s * 1.15, .6, .92), clamp(l, .58, .68)),
      bar1: hsl(h2, clamp(second[1] * 1.1, .55, .92), clamp(second[2], .6, .7)),
      artistc: hsl(h, clamp(s, .35, .7), .8),
      glow1: hsl(h, clamp(s, .5, .8), .4),
      glow2: hsl(h2, .6, .36),
      glow3: hsl(h3, .55, .34),
    };
  } catch { return null; }
}

const MONO = { accent: '#e4e8f2', bar1: '#8d96ad', artistc: '#cfd5e3', glow1: '#3b4a66', glow2: '#3a3550', glow3: '#2c4a5a' };
function applyPalette(p) {
  p = p || MONO;
  const r = document.documentElement.style;
  for (const k of ['accent', 'bar1', 'artistc', 'glow1', 'glow2', 'glow3']) r.setProperty('--' + k, p[k]);
}

/* ---------------- Spotify auth (PKCE, no secret, no server) ---------------- */
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
function randomString(n = 64) { const a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a); }

async function startLogin(mode, cid) {
  const verifier = randomString(64), st = randomString(16);
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  store.set('verifier', verifier); store.set('state', st); store.set('mode', mode);
  store.set('pending_cid', cid); store.set('return', location.search);
  location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
    response_type: 'code', client_id: cid, scope: SCOPES, redirect_uri: REDIRECT_URI,
    code_challenge_method: 'S256', code_challenge: challenge, state: st,
  });
}

async function tokenRequest(params) {
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(params),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error_description || j.error || ('HTTP ' + r.status)); e.code = j.error; throw e; }
  return j;
}

function saveTokens(j, cid) {
  store.set('at', j.access_token);
  store.set('exp', String(Date.now() + (j.expires_in - 60) * 1000));
  if (j.refresh_token) store.set('rt', j.refresh_token);
  if (cid) store.set('cid', cid);
}

const auth = { cid: null, refreshing: null };

async function refresh() {
  if (auth.refreshing) return auth.refreshing;
  auth.refreshing = (async () => {
    const candidates = [store.get('rt'), HASH.get('rt')].filter((v, i, a) => v && a.indexOf(v) === i);
    let lastErr;
    for (const rt of candidates) {
      try { saveTokens(await tokenRequest({ grant_type: 'refresh_token', refresh_token: rt, client_id: auth.cid }), auth.cid); return; }
      catch (e) { lastErr = e; if (e.code !== 'invalid_grant') throw e; }
    }
    store.del('rt'); store.del('at');
    throw Object.assign(new Error('Login expired'), { code: 'relogin', cause: lastErr });
  })();
  try { return await auth.refreshing; } finally { auth.refreshing = null; }
}

async function accessToken() {
  if (!store.get('at') || Date.now() > +store.get('exp')) await refresh();
  return store.get('at');
}

async function api(path) {
  let r = await fetch('https://api.spotify.com/v1' + path, { headers: { Authorization: 'Bearer ' + await accessToken() } });
  if (r.status === 401) { store.del('at'); r = await fetch('https://api.spotify.com/v1' + path, { headers: { Authorization: 'Bearer ' + await accessToken() } }); }
  return r;
}

function normalize(j) {
  const it = j && j.item;
  if (!it) return null;                                   // ads, private session, etc.
  const isEp = it.type === 'episode';
  const imgs = isEp ? (it.images || []) : ((it.album && it.album.images) || []);
  const art = (imgs.find(i => i.width && i.width <= 320) || imgs[0] || {}).url;
  return {
    id: it.id || it.uri, title: it.name,
    artist: isEp ? (it.show && it.show.name) || '' : (it.artists || []).map(a => a.name).join(', '),
    art, dur: it.duration_ms, progress: j.progress_ms || 0, playing: !!j.is_playing,
  };
}

async function pollLoop() {
  let delay = POLL_MS;
  try {
    const r = await api('/me/player/currently-playing?additional_types=episode');
    if (r.status === 204) render(null);
    else if (r.status === 429) delay = (parseInt(r.headers.get('Retry-After')) || 10) * 1000;
    else if (r.ok) {
      const t = normalize(await r.json());
      render(t);
      // If the song ends before the next regular check, check right when it ends instead.
      if (t && t.playing && t.dur) {
        const left = t.dur - t.progress;
        if (left + END_CHECK_MS < delay) delay = Math.max(250, left + END_CHECK_MS);
      }
    }
  } catch (e) {
    if (e.code === 'relogin') { setVisible(false); showConnect('Spotify asked to log in again.'); return; }
    delay = 8000;                                           // network hiccup — just retry
  }
  setTimeout(pollLoop, delay);
}

/* ---------------- Panels (connect / setup) ---------------- */
function showPanel(html) { $('panel').hidden = false; $('panelBody').innerHTML = html; }
function hidePanel() { $('panel').hidden = true; }

function needCid() {
  showPanel(`<h2>Now Playing widget</h2>
    <p>Add your Spotify app's Client ID to the end of this page's address, like:<br><code>${REDIRECT_URI}?cid=YOUR_CLIENT_ID</code></p>
    <p>Or try <code>?demo=1</code> to preview the look.</p>`);
}

function showConnect(reason) {
  showPanel(`<h2>Connect Spotify</h2>
    <p>${reason ? reason + ' ' : ''}Click below and log in once. The widget remembers you after that.</p>
    <button class="btn" id="go">Connect Spotify</button>`);
  $('go').onclick = () => startLogin('widget', auth.cid);
}

function showSetup() {
  document.body.classList.add('setup');
  showPanel(`<h2>Get your OBS link</h2>
    <p>Log in to Spotify here, in your normal browser. You'll get a link to paste into an OBS Browser Source.</p>
    <button class="btn" id="go">Connect Spotify</button>`);
  $('go').onclick = () => startLogin('setup', auth.cid);
}

function showObsLink(cid, rt) {
  document.body.classList.add('setup');
  const link = `${REDIRECT_URI}?cid=${encodeURIComponent(cid)}#rt=${encodeURIComponent(rt)}`;
  showPanel(`<h2>You're connected ✓</h2>
    <p>Copy this link into OBS → Sources → <b>Browser</b> → URL.</p>
    <textarea class="link" readonly id="lnk"></textarea>
    <p class="warn">This link contains your Spotify login. Don't share it or show it on stream.</p>
    <button class="btn" id="copy">Copy link</button>`);
  $('lnk').value = link;
  $('copy').onclick = async () => {
    $('lnk').select();
    try { await navigator.clipboard.writeText(link); } catch { document.execCommand('copy'); }
    $('copy').textContent = 'Copied ✓';
  };
}

/* ---------------- Demo mode ---------------- */
function demoArt(c1, c2, c3) {
  const c = document.createElement('canvas'); c.width = c.height = 300;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 300, 300); g.addColorStop(0, c1); g.addColorStop(1, c2);
  x.fillStyle = g; x.fillRect(0, 0, 300, 300);
  x.globalAlpha = .85; x.fillStyle = c3; x.beginPath(); x.arc(200, 110, 70, 0, 7); x.fill();
  x.globalAlpha = .35; x.fillStyle = '#000'; x.fillRect(0, 205, 300, 95);
  x.globalAlpha = .6; x.strokeStyle = c3; x.lineWidth = 3;
  for (let i = 0; i < 5; i++) { x.beginPath(); x.moveTo(0, 220 + i * 16); x.bezierCurveTo(100, 200 + i * 14, 200, 250 + i * 10, 300, 225 + i * 16); x.stroke(); }
  return c.toDataURL('image/png');
}

function runDemo() {
  const tracks = [
    { title: 'Neon Coastline', artist: 'Violet Static', art: demoArt('#0d2a4a', '#1b6ca8', '#ff7a59'), dur: 236000 },
    { title: 'Velvet Afterglow', artist: 'Mira Lune', art: demoArt('#3a0d3f', '#c2185b', '#ffd166'), dur: 198000 },
    { title: 'Cold Signal (Extended Night Drive Mix)', artist: 'Northbound, Kaito Rey', art: demoArt('#06231f', '#14a38b', '#c6f7e9'), dur: 312000 },
    { title: 'Gold Room', artist: 'The Low Lights', art: demoArt('#3b2400', '#d98e04', '#fff3b0'), dur: 174000 },
  ];
  let i = 0;
  const step = () => {
    const t = tracks[i % tracks.length];
    const start = 42000 + (i % 3) * 30000;
    render({ ...t, id: 'demo' + (i % tracks.length), progress: start, playing: true });
    i++;
    setTimeout(step, 9000);
  };
  step();
}

/* ---------------- Boot ---------------- */
(async function boot() {
  if (Q.get('demo')) { runDemo(); return; }

  // Returning from Spotify login
  if (Q.has('code') || Q.has('error')) {
    const mode = store.get('mode') || 'widget', cid = store.get('pending_cid');
    const ret = store.get('return') || '';
    if (Q.get('error') || Q.get('state') !== store.get('state')) {
      history.replaceState(null, '', REDIRECT_URI + ret);
      auth.cid = cid;
      (mode === 'setup' ? showSetup : showConnect)('Login was cancelled or failed.');
      return;
    }
    try {
      const j = await tokenRequest({ grant_type: 'authorization_code', code: Q.get('code'), redirect_uri: REDIRECT_URI, client_id: cid, code_verifier: store.get('verifier') });
      history.replaceState(null, '', REDIRECT_URI + ret);
      store.del('verifier'); store.del('state');
      if (mode === 'setup') { showObsLink(cid, j.refresh_token); return; }   // don't keep tokens in the setup browser
      saveTokens(j, cid);
    } catch (e) {
      history.replaceState(null, '', REDIRECT_URI + ret);
      auth.cid = cid; showConnect('Login failed (' + e.message + ').'); return;
    }
  }

  auth.cid = Q.get('cid') || CLIENT_ID_DEFAULT || store.get('cid');
  if (!auth.cid) { needCid(); return; }
  if (Q.get('setup')) { showSetup(); return; }

  if (!store.get('rt') && !HASH.get('rt')) { showConnect(); return; }
  hidePanel();
  pollLoop();
})();

document.fonts && document.fonts.ready.then(() => state.id && fitTitle());
</script>
